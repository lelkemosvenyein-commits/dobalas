<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Közösségi dobolás – jelentkezés</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: transparent; }

    .event-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      max-width: 560px;
    }

    .event-title { font-size: 18px; font-weight: 500; color: #111; margin-bottom: 1rem; }

    .coming-label { font-size: 14px; font-weight: 500; color: #111; margin-bottom: 0.4rem; }
    .attendee-list { font-size: 14px; color: #555; line-height: 1.8; }

    hr { border: none; border-top: 1px solid #eee; margin: 1.25rem 0; }

    .signup-row { display: flex; gap: 10px; }
    .signup-row input {
      flex: 1; padding: 8px 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; outline: none;
    }
    .signup-row input:focus { border-color: #aaa; }
    .signup-row button {
      padding: 8px 16px; background: #fff; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .signup-row button:hover { background: #f5f5f5; }

    .msg { font-size: 13px; margin-top: 8px; min-height: 20px; }
    .msg.ok { color: #2a7a2a; }
    .msg.err { color: #c0392b; }

    .admin-toggle {
      font-size: 12px; color: #aaa; cursor: pointer;
      text-decoration: underline; display: inline-block; margin-top: 0.75rem;
    }
    .admin-box {
      background: #f9f9f9; border-radius: 8px;
      padding: 1rem; margin-top: 0.75rem; display: none;
    }
    .admin-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .admin-row input {
      flex: 1; padding: 6px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 13px;
    }
    .admin-row button {
      padding: 6px 12px; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .admin-note { font-size: 12px; color: #aaa; }
    .del-btn { color: #c0392b !important; }
  </style>
</head>
<body>

<div class="event-card">
  <div class="event-title">Csatlakozom az eseményhez</div>
  <div class="coming-label" id="comingLabel">Még senki nem jelentkezett — légy te az első!</div>
  <div class="attendee-list" id="attendeeList"></div>

  <hr>

  <div class="signup-row">
    <input type="text" id="nickInput" placeholder="Beceneved..." maxlength="24" />
    <button onclick="signUp()">Jelentkezem</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<span class="admin-toggle" onclick="toggleAdmin()">⚙ Esemény adatok szerkesztése</span>
<div class="admin-box" id="adminBox">
  <div class="admin-row">
    <button class="del-btn" onclick="resetList()">Lista törlése</button>
  </div>
  <p class="admin-note">A lista törlésével új eseményre lehet frissen kezdeni.</p>
</div>

<script>
  // ── SUPABASE BEÁLLÍTÁS ──────────────────────────────────────────────────────
  // 1. Menj a https://supabase.com oldalra, hozz létre egy ingyenes projektet
  // 2. Project Settings → API → másold ide a Project URL-t és az anon key-t
  const SUPABASE_URL = 'https://nqojyskseegbayxzpupf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xb2p5c2tzZWVnYmF5eHpwdXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTc2OTYsImV4cCI6MjA5NTM5MzY5Nn0.bi_JAlvUMykkioOoopEdtsEDXDE_tkrqfpRgZrmt-Ck';
  // ───────────────────────────────────────────────────────────────────────────

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function load() {
    const { data: attendees } = await sb.from('attendees').select('name').order('created_at');
    return {
      attendees: (attendees || []).map(r => r.name)
    };
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function render() {
    const { attendees } = await load();
    const label = document.getElementById('comingLabel');
    const list = document.getElementById('attendeeList');
    if (attendees.length === 0) {
      label.textContent = 'Még senki nem jelentkezett — légy te az első!';
      list.innerHTML = '';
    } else {
      label.textContent = 'Mi már jövünk:';
      list.innerHTML = attendees.map(n => `<span>#${esc(n)}</span>`).join(', ');
    }
  }

  async function signUp() {
    const input = document.getElementById('nickInput');
    const nick = input.value.trim();
    if (!nick) { showMsg('Írj be egy becenevet!', 'err'); return; }
    if (nick.length < 2) { showMsg('Legalább 2 karakter legyen!', 'err'); return; }

    const { attendees } = await load();
    if (attendees.map(n => n.toLowerCase()).includes(nick.toLowerCase())) {
      showMsg('Ez a becenév már foglalt, próbálj egy másikat!', 'err'); return;
    }

    const { error } = await sb.from('attendees').insert({ name: nick });
    if (error) { showMsg('Hiba történt, próbáld újra.', 'err'); return; }
    input.value = '';
    showMsg('Sikeresen jelentkeztél!', 'ok');
    render();
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(() => { el.textContent = ''; el.className = 'msg'; }, 3500);
  }

  function toggleAdmin() {
    const box = document.getElementById('adminBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  async function saveTitle() {
    const title = document.getElementById('adminTitle').value.trim();
    if (!title) return;
    await sb.from('meta').upsert({ key: 'title', value: title });
    document.getElementById('adminTitle').value = '';
    render();
  }

  async function resetList() {
    if (!confirm('Biztosan törlöd a listát?')) return;
    await sb.from('attendees').delete().neq('name', '');
    render();
  }

  document.getElementById('nickInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') signUp();
  });

  render();
</script>
</body>
</html>
